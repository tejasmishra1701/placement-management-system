<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMS - Placement Management System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a8a'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="brand" href="#/" id="brand-link"><span class="brand-mark">PMS</span><span class="brand-sep">|</span><span id="screen-label">Home</span></a>
      <nav class="nav" id="nav"></nav>
      <div class="user-area">
        <a class="bell" id="bell" href="#/notifications" title="Alerts"><span class="bell-icon" aria-hidden="true">&#128276;</span><span class="bell-count" id="bell-count" hidden>0</span></a>
        <span class="user-chip" id="user-chip"></span>
        <button class="btn ghost sm" id="logout-btn" type="button">Logout</button>
      </div>
    </div>
  </header>
  <main class="content" id="view"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
